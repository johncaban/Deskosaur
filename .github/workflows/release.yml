name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with the .NET Framework compiler built into Windows
        shell: cmd
        run: >
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+
          /out:Deskosaur.exe /win32icon:src\Win\deskosaur.ico
          /r:System.Windows.Forms.dll /r:System.Drawing.dll
          src\Core\*.cs src\Win\*.cs

      - name: Package player zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Deskosaur/setup | Out-Null
          Copy-Item Deskosaur.exe, README.txt, "Install Deskosaur.bat" dist/Deskosaur/
          Copy-Item setup/*.ps1 dist/Deskosaur/setup/
          Compress-Archive -Path dist/Deskosaur -DestinationPath Deskosaur.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deskosaur
          path: Deskosaur.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Deskosaur.zip
          generate_release_notes: true
